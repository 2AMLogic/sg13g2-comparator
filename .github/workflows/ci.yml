# CI for sg13g2-comparator.
#
# Scope is deliberate and documented: this workflow runs **tool-light** legs
# only -- re-rendering this block's `klt signoff` tier-verdict report from
# `manifests/sg13g2-comparator.json` and requiring it to equal the committed
# `manifests/t1-signoff-report.json` (the T1 verdict of record, issue #37),
# and regenerating the committed layout stream and requiring it to be
# byte-identical (issue #58). None of that needs the SG13G2 PDK, only the
# pinned `klt`.
#
# The PDK-dependent benches under `sim/` are NOT run here: they need a
# fetched IHP-Open-PDK checkout plus ngspice/OpenVAF (see
# `sim/toolchain.json` for the pins), which is a real, recurring cost to
# provision on a hosted runner. That leg stays a local, contributor-run step
# with its result committed as an append-only record under
# `sim/*/records/` -- see `sim/README.md`. What IS run here is the
# harness's own stdlib-only unit tests (`sim/harness/tests/`, selftest step
# 0, issue #75), which need no PDK and no installs. Do not silently drop
# this comment if the PDK-heavy leg is ever added -- update `sim/README.md`
# in the same change. The same job also checks, read-only, that the
# post-layout `klt pex` adapter inputs in `sim/comparator-pex/` are fresh
# against their sources (issue #123) -- also stdlib only, no PDK.
#
# The one PDK-dependent leg that IS run here (issue #224) is the real
# schematic-to-netlist freshness check (`design/netlist.py --check`, job
# `netlist-regeneration`): it provisions a pinned xschem and the PDK release
# pinned in `sim/pdk.json` (no OSDI/ngspice needed; netlisting reads only
# schematics, symbols and the PDK's xschem libraries). See design/README.md.
#
# Pinning policy: third-party actions and `klt` are pinned by full commit SHA
# (action tags are kept as trailing comments) so verdicts are reproducible.
# Bumps are deliberate changes, made by hand in a reviewed PR.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Started runs must finish so verdicts for distinct commits are retained;
  # pending runs are still replaced by the newest one (normal GitHub behavior).
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  signoff-manifest-parity:
    name: signoff manifest parity (T1 verdict of record, pinned klt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Issue #132: explicit sparse working tree = this job's complete
          # transitive inputs (audited in sim/README.md, "Sparse CI checkouts";
          # proven by scripts/tests/test_sparse_checkout.py). actions/checkout
          # implies `--filter=blob:none` with this input (a partial clone);
          # harmless here because this job reads only blobs inside its cone
          # and never measures sizes. The size job avoids this input.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/ci.yml
            /scripts/check_klt_pin.py
            /scripts/check_signoff_report.py
            /scripts/check_readme_claims.py
            /README.md
            /manifests/
            /layout/
            /design/
            /sim/harness/
            /sim/kltsim/
            /sim/comparator-pex/
            /sim/run_*.py
            /sim/comparator-transient-noise/*.py
            /sim/comparator-transient-noise-full/*.py
            /sim/device-mismatch-confirm/*.py
            /scripts/
            /sim/comparator-regeneration/testbench/
            /sim/comparator-kickback/testbench/
            /sim/dut/
            /sim/characterize.sh
            /sim/run_characterization.py
            /sim/characterization/
            /sim/klt-yield/
            /sim/dut.json
            /sim/klt-corner-verification/benches/
            /sim/klt-corner-verification/rows.json
            /sim/klt-corner-verification/campaigns/20261009-d73a9ac/*.json
            /sim/klt-corner-verification/campaigns/20261009-d73a9ac/*.jsonl
            /sim/klt-corner-verification/campaigns/20261009-d73a9ac/*.spice
            /sim/comparator-transient-noise/records/20260921-154729-41cbc7f.md
            /sim/klt-corner-verification/campaigns/20261009-issue81/noise_full.json
            /sim/comparator-offset-transient-mc/records/20260917-060858-ea40b57.json
            /sim/comparator-offset-cm-band/campaigns/20261009-5185f52/comparison.json
            /sim/comparator-kickback/records/20260916-022249-36773c7.json
            /spec/decision-records/0002-target-spec-ratification.md

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      # Issue #135: manifests/klt-pin.json is the single source of truth for
      # the pinned klt/KLayout build. Every machine-read copy (both install
      # lines below, layout/run_flow.sh, the frozen signoff report's `build`
      # block, DRC/LVS/ERC report provenance) must agree, so a partial pin
      # bump fails here, naming both locations. Stdlib only, runs before any
      # install. pex_report.json is deliberately a different build: excluded.
      - name: Pinned klt/KLayout build drift guard (manifests/klt-pin.json)
        run: python3 scripts/check_klt_pin.py

      # Pinned to the exact klt build that froze the committed report --
      # a different build (different tier doc item set, different grading
      # rules, different `build` block) is itself a parity divergence.
      # See manifests/README.md for the freeze/pin contract.
      - name: Install klt (pinned, see manifests/README.md)
        run: |
          python3 -m pip install --disable-pip-version-check \
            "klayout-tools @ git+https://github.com/2AMLogic/klayout-tools@3a75c3ae705b7ad3803625255de93bcd982e70c6"
          klt --version

      # Issue #64: the T1 item 8 characterization report. Stdlib only, no
      # simulator: re-hashes every indexed source, regenerates the report from
      # the committed campaign, and checks the manifest's item 8 pin.
      - name: Characterization report freshness (T1 item 8)
        run: sim/characterize.sh report check

      - name: Fresh-render parity check vs committed report
        run: python3 scripts/check_signoff_report.py

      # Issue #174: README target-spec-table figures vs the committed report
      # (stdlib only). Unmapped claims are listed as UNCHECKED, never passed.
      # Issue #193: noise/offset claims read their own sources (the issue #81
      # noise_full.json, the whole-latch offset record JSON, the issue #228
      # common-mode comparison.json and the issue #232 historical kickback
      # record); all are in this job's sparse cone above.
      - name: README spec-table figures match the committed report
        run: python3 scripts/check_readme_claims.py

      - name: Render the tier report (text, for the run log)
        if: always()
        run: klt signoff --manifest manifests/sg13g2-comparator.json || test $? -eq 3

  # Layout reproducibility (issue #58): the committed GDS must be exactly what
  # layout/comparator/generate.py draws from a clean checkout, and that drawing
  # must still reconcile with design/comparator.spice. It also covers the
  # committed LVS evidence (issue #60): extraction, reference cut, request and
  # envelope freshness plus the match verdict. Needs only the pinned
  # klt and the KLayout Python module it brings -- no PDK -- so it belongs to
  # the same tool-light scope as the leg above. See layout/README.md.
  layout-reproducibility:
    name: layout reproducibility (committed GDS regenerates byte-for-byte)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Issue #132: explicit sparse working tree = this job's complete
          # transitive inputs (audited in sim/README.md, "Sparse CI checkouts";
          # proven by scripts/tests/test_sparse_checkout.py). actions/checkout
          # implies `--filter=blob:none` with this input (a partial clone);
          # harmless here because this job reads only blobs inside its cone
          # and never measures sizes. The size job avoids this input.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /layout/
            /design/comparator.spice
            /manifests/klt-pin.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      # Same klt pin as the leg above; KLayout pinned to the version that
      # klt build was tested against (layout/run_flow.sh, KLAYOUT_PIN).
      - name: Install klt (pinned) + KLayout
        run: |
          python3 -m pip install --disable-pip-version-check \
            "klayout-tools @ git+https://github.com/2AMLogic/klayout-tools@3a75c3ae705b7ad3803625255de93bcd982e70c6" \
            "klayout==0.30.12"
          klt --version

      - name: Regenerate and verify the committed layout
        run: KLT_NATIVE=1 layout/run_flow.sh --check

      # Issue #257: the pSD.i/pSD.b geometry regression needs the klayout
      # module installed above, so it is outside the stdlib-only `test_*.py`
      # discovery of harness-unit-tests. Run it here explicitly. A missing
      # module, a failing test, an empty population or any skipped test
      # fails the step; a skip is never success.
      - name: Run KLayout implant geometry regression tests
        run: |
          set -o pipefail
          test -f layout/tests/klayout_test_implant_geometry.py
          python3 -I -m unittest discover -v -s layout/tests -p 'klayout_test_*.py' 2>&1 | tee "${RUNNER_TEMP:-/tmp}/klayout_tests.log"
          grep -Eq '^Ran [1-9][0-9]* tests? ' "${RUNNER_TEMP:-/tmp}/klayout_tests.log"
          ! grep -Eq 'skipped|NO TESTS RAN' "${RUNNER_TEMP:-/tmp}/klayout_tests.log"

  # Schematic-to-netlist freshness (issue #224): design/comparator.spice is
  # the hashed T1 item 1 anchor (manifests/README.md) and is DERIVED from the
  # xschem schematics, which nothing else hashes. This job runs the real
  # generator in check mode with a real, pinned xschem (built from source by
  # scripts/provision_netlist_env.sh, which holds the xschem pin) and the
  # PDK release/sha256 declared in sim/pdk.json, resolved through the same
  # discovery contract the harness uses (PDK_ROOT, sim/harness/pdk.py).
  # Nothing here skips: a missing xschem, symbol, PDK input or a stale
  # netlist fails the job. The mocked tests in design/tests/ still run in
  # harness-unit-tests; they check generator logic, not this schematic.
  netlist-regeneration:
    name: netlist regeneration (schematics regenerate the committed netlist, real xschem + pinned PDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Issue #132/#224: explicit sparse cone = this job's complete inputs
          # (generator, schematics, symbols and committed netlist in design/;
          # harness modules netlist.py imports; the PDK pin; the provisioner).
          # Proven by scripts/tests/test_sparse_checkout.py.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /design/
            /sim/harness/
            /sim/pdk.json
            /scripts/provision_netlist_env.sh

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      # Tool provisioning (not a repo input; skipped by the sparse-cone test).
      - name: Provision xschem build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential tcl tcl-dev tk tk-dev libx11-dev libxpm-dev \
            libcairo2-dev bison flex gawk

      - name: Provision pinned xschem
        run: scripts/provision_netlist_env.sh xschem "$RUNNER_TEMP/xschem"

      - name: Provision pinned SG13G2 PDK (sim/pdk.json)
        run: scripts/provision_netlist_env.sh pdk "$RUNNER_TEMP/pdk"

      - name: Regenerate netlist from schematics and compare (design/netlist.py --check)
        env:
          PDK_ROOT: ${{ runner.temp }}/pdk
          PDK: ihp-sg13g2
        run: |
          export PATH="$RUNNER_TEMP/xschem/bin:$PATH"
          test "$(command -v xschem)" = "$RUNNER_TEMP/xschem/bin/xschem"
          xschem --version 2>&1 | grep -m1 '^XSCHEM V'
          python3 design/netlist.py --check
          test -z "$(git status --porcelain)"

  # Harness unit tests (issue #75): the same command as `sim/selftest.sh`
  # step 0. Pure stdlib -- no PDK, no ngspice, no installs -- so it belongs
  # to the same tool-light scope as the legs above. The PDK-dependent
  # selftest steps stay local (see sim/README.md).
  harness-unit-tests:
    name: harness unit tests (stdlib only, no PDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Issue #132: explicit sparse working tree = this job's complete
          # transitive inputs (audited in sim/README.md, "Sparse CI checkouts";
          # proven by scripts/tests/test_sparse_checkout.py). actions/checkout
          # implies `--filter=blob:none` with this input (a partial clone);
          # harmless here because this job reads only blobs inside its cone
          # and never measures sizes. The size job avoids this input.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/ci.yml
            /sim/harness/
            /sim/run_*.py
            /sim/tools/build-osdi.sh
            /sim/tools/regen_reverse_control.py
            /sim/kltsim/
            /sim/comparator-pex/
            /sim/comparator-regeneration/testbench/
            /sim/comparator-kickback/testbench/
            /sim/comparator-transient-noise/*.py
            /sim/comparator-transient-noise-full/*.py
            /sim/device-mismatch-confirm/*.py
            /sim/dut.json
            /sim/dut/
            /sim/klt-corner-verification/benches/
            /sim/klt-corner-verification/rows.json
            /sim/klt-corner-verification/campaigns/20261009-issue78/fixture/
            /sim/klt-corner-verification/campaigns/20261009-d73a9ac/*.json
            /sim/klt-corner-verification/campaigns/20261009-d73a9ac/*.jsonl
            /sim/klt-corner-verification/campaigns/20261009-d73a9ac/*.spice
            /sim/klt-corner-verification/campaigns/20261010-n200/*.json
            /sim/klt-corner-verification/campaigns/20261010-n200/*.jsonl
            /sim/klt-corner-verification/campaigns/20261010-n200/*.spice
            /sim/klt-corner-verification/campaigns/20261009-d73a9ac/smoke/offset_mc-mismatch-vs-negctrl.envelope.json
            /sim/klt-corner-verification/campaigns/20261010-n200/smoke/offset_mc-preflight-seed-mismatch.envelope.json
            /sim/klt-yield/
            /sim/characterization/
            /sim/comparator-transient-noise/records/20260921-154729-41cbc7f.md
            /spec/decision-records/0002-target-spec-ratification.md
            /manifests/sg13g2-comparator.json
            /manifests/t1-signoff-report.json
            /manifests/klt-pin.json
            /design/
            /scripts/
            /layout/tests/
            /layout/common_sg13g2.py
            /layout/comparator/*.py
            /layout/comparator/erc_report.json
            /layout/comparator/pdk_drc_report.json
            /layout/comparator/comparator.gds
            /layout/comparator/pex_report.json
            /layout/comparator/comparator.pex.spice

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      # Issue #216: fail closed when the sparse cone omits a lint input. With
      # F-only rules ruff merely warns about a missing root and exits zero,
      # and the `sim/run_*.py` glob expands to whatever was checked out, so
      # the static check below could look green while skipping promised files
      # (run 38159735276). The preflight derives the intended set from git's
      # tracked inventory (ls-tree of HEAD, independent of the sparse working
      # tree), names every omitted path and fails before ruff runs. It also
      # pins ci.yml's ruff arguments to its own LINT_ROOTS copy (why ci.yml
      # is in this job's cone); the noise/mismatch roots check out source
      # only (`*.py`) so the large simulation evidence stays out.
      - name: Lint population preflight (every tracked lint input checked out)
        run: python3 scripts/check_lint_population.py

      # Issue #157: pinned pyflakes-class static check (F rules only: undefined
      # names, unused imports/locals, redefinitions). CI-only tool; the exact
      # pin lives here and nowhere else. Needs no PDK, ngspice or KLayout.
      - name: Install ruff (pinned)
        run: python3 -m pip install ruff==0.17.0

      - name: Static check (ruff F rules) over harness, kltsim, run_*.py, guards, design and layout tooling
        run: |
          ruff check --select F design layout scripts sim/harness sim/kltsim \
            sim/comparator-pex sim/run_*.py sim/comparator-transient-noise \
            sim/comparator-transient-noise-full sim/device-mismatch-confirm

      - name: Run sim harness unit tests
        run: PYTHONPATH=sim python3 -m unittest discover -t sim -s harness.tests -p 'test_*.py'

      # Issue #62: the klt sim corner-verification adapter's grading rules
      # (sim/kltsim/), same stdlib-only contract; `sim/selftest.sh` step 0.
      # Includes test_build_preserve.py (issue #95): campaign inputs are
      # append-only; a changed rebuild is rejected before any write.
      - name: Run kltsim grading unit tests
        run: PYTHONPATH=sim python3 -m unittest discover -t sim -s sim/kltsim/tests -p 'test_*.py'

      # Issue #123: the post-layout (klt pex) adapter inputs under
      # sim/comparator-pex/{dut,requests}/ must equal what their generators
      # derive from the current schematic (core AND comparator_dut wrapper),
      # sim/dut.json and the source benches. Check mode is read-only and
      # stdlib only -- no PDK, ngspice, klt or batch submission. It covers the
      # current generated inputs only, never reports/ or campaign evidence.
      # Every generator runs so all stale paths are reported at once.
      - name: Post-layout input freshness check (sim/comparator-pex)
        run: |
          rc=0
          for gen in make_reference make_testbenches make_requests make_devonly; do
            python3 "sim/comparator-pex/$gen.py" --check || rc=1
          done
          test -z "$(git status --porcelain)" || { git status --porcelain; rc=1; }
          exit $rc

      # Issue #181: also the delta-table renderer (availability vs compliance),
      # offline against the committed nominal envelope and synthetic fixtures.
      - name: Run post-layout freshness and delta-table unit tests
        run: python3 -m unittest discover -s sim/comparator-pex/tests -p 'test_*.py'

      # Issue #117: ERC request/judge (stand-in klayout, mutate() untested) and
      # netlist generator (xschem mocked). Stdlib only, no PDK/klayout/xschem.
      - name: Run ERC tool unit tests
        run: python3 -I -m unittest discover -s layout/tests -p 'test_*.py'

      - name: Run netlist generator unit tests
        run: python3 -I -m unittest discover -s design/tests -p 'test_*.py'

  # Append-only sim evidence guard (issue #116): protected paths under
  # sim/<bench>/{records,corners,netlist-snapshots,campaigns,reports}/ may
  # not be modified, deleted, moved away or mode-changed relative to the base
  # (exceptions only via sim/evidence-exceptions.json + a decision record).
  # Needs full history for merge-base. Stdlib only. See sim/README.md.
  append-only-evidence:
    name: append-only sim evidence (stdlib only, no PDK)
    runs-on: ubuntu-latest
    steps:
      # Full history AND every blob (a complete, non-partial clone): the size
      # guard reads blob sizes via `git ls-tree -rl`. Deliberately NO
      # `sparse-checkout:` input here: actions/checkout silently adds
      # `--filter=blob:none` whenever that input is set (an empty `filter:`
      # cannot turn it off), and in that partial clone ls-tree -l lazily
      # fetches every blob one at a time (~97k round trips; CI run
      # 38029844566 hung). The working tree is narrowed by the next step.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Issue #132: explicit sparse working tree = this job's complete inputs
      # (audited in sim/README.md, "Sparse CI checkouts"; proven by
      # scripts/tests/test_sparse_checkout.py), applied after the full fetch
      # so no blob filter is ever involved. Fails if the clone is partial.
      - name: Narrow working tree to this job's inputs (sparse, no blob filter)
        run: |
          set -eu
          if git config --get extensions.partialclone >/dev/null || git config --get-regexp '^remote\..*\.promisor$' >/dev/null; then
            echo "::error::checkout is a partial clone; size accounting needs every blob"; exit 2
          fi
          git sparse-checkout set --no-cone --stdin <<'EOF'
          /.github/workflows/ci.yml
          /scripts/
          /README.md
          /sim/characterization/20261009-d73a9ac-schematic-r2/report.json
          /sim/klt-corner-verification/campaigns/20261009-issue81/noise_full.json
          /sim/comparator-offset-transient-mc/records/20260917-060858-ea40b57.json
          /sim/comparator-offset-cm-band/campaigns/20261009-5185f52/comparison.json
          /sim/comparator-kickback/records/20260916-022249-36773c7.json
          /sim/evidence-exceptions.json
          /sim/evidence-size-budget.json
          /sim/evidence-size-exceptions/
          /spec/decision-records/
          EOF
          echo "tracked files in working tree: $(git ls-files -t | grep -c '^H ' || true)"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Check evidence is append-only
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          GITHUB_SHA_CUR: ${{ github.sha }}
        run: |
          set -eu
          empty_tree=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          case "$EVENT_NAME" in
            pull_request)
              # Actual PR head (not the synthetic merge commit) vs merge base.
              git cat-file -e "$PR_BASE_SHA^{commit}" || { echo "::error::PR base $PR_BASE_SHA unavailable"; exit 2; }
              git cat-file -e "$PR_HEAD_SHA^{commit}" || { echo "::error::PR head $PR_HEAD_SHA unavailable"; exit 2; }
              base=$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA") || { echo "::error::no merge base for $PR_BASE_SHA..$PR_HEAD_SHA"; exit 2; }
              head=$PR_HEAD_SHA
              echo "mode: pull_request, merge-base $base -> head $head"
              ;;
            push)
              head=$PUSH_AFTER
              if [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ]; then
                base=$empty_tree
                echo "mode: initial push, empty tree -> $head"
              else
                git cat-file -e "$PUSH_BEFORE^{commit}" || { echo "::error::push base $PUSH_BEFORE unavailable"; exit 2; }
                base=$PUSH_BEFORE
                echo "mode: push, $base -> $head"
              fi
              ;;
            workflow_dispatch)
              # Last-commit audit only; not a full-history audit.
              git rev-parse --verify --quiet "$GITHUB_SHA_CUR^" >/dev/null || { echo "::error::no parent commit for last-commit audit"; exit 2; }
              base=$GITHUB_SHA_CUR^
              head=$GITHUB_SHA_CUR
              echo "mode: workflow_dispatch LAST-COMMIT AUDIT, $base -> $head"
              ;;
            *)
              echo "::error::unsupported event $EVENT_NAME"; exit 2 ;;
          esac
          python3 scripts/check_append_only_evidence.py --base "$base" --head "$head"

      # Issue #132: tracked sim/ evidence size budget. Measures committed blob
      # bytes of the target tree (git ls-tree -rl), so the sparse working tree
      # above does not matter; fails closed (exit 2, no lazy fetch) on a
      # partial clone or if sizes cannot be read.
      - name: Check tracked sim/ evidence size budget
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_evidence_size.py --tree "$TARGET_SHA"

      # Issue #318: new evidence bytes live in the fleet artifact store; git
      # keeps manifests under manifests/artifacts/. Reads the target tree via
      # git (sparse working tree irrelevant): schema, and that no stored
      # object's bytes are also committed. CI cannot reach the broker, so the
      # bytes are NOT hash-verified here and the step says so; `verify` is the
      # out-of-band step (sim/README.md, "Stored evidence").
      - name: Check stored-evidence manifests (schema + no committed blobs)
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_artifact_manifests.py check --tree "$TARGET_SHA"

      # Issue #216: the sparse-cone proof's ruff-dependent negative controls
      # (glob under-expansion stays green; undefined name in a previously
      # omitted root fails) run the same pinned ruff the harness job lints
      # with. Without it those controls skip instead of proving -- exactly
      # the silent-under-coverage pattern this issue exists to close.
      - name: Install ruff (pinned, for the sparse-cone negative controls)
        run: python3 -m pip install ruff==0.17.0

      # Runs every scripts/tests/test_*.py: the evidence guard tests above,
      # the klt pin drift guard tests (issue #135), the size budget tests and the
      # sparse-checkout cone proof (issue #132).
      - name: Run scripts/ guard unit tests (evidence, size, klt pin, sparse cones)
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
