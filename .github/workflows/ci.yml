# CI for sg13g2-comparator.
#
# Scope is deliberate and documented: this workflow runs **tool-light** legs
# only -- re-rendering this block's `klt signoff` tier-verdict report from
# `manifests/sg13g2-comparator.json` and requiring it to equal the committed
# `manifests/t1-signoff-report.json` (the T1 verdict of record, issue #37),
# and regenerating the committed layout stream and requiring it to be
# byte-identical (issue #58). None of that needs the SG13G2 PDK, only the
# pinned `klt`.
#
# The PDK-dependent benches under `sim/` are NOT run here: they need a
# fetched IHP-Open-PDK checkout plus ngspice/OpenVAF (see
# `sim/toolchain.json` for the pins), which is a real, recurring cost to
# provision on a hosted runner. That leg stays a local, contributor-run step
# with its result committed as an append-only record under
# `sim/*/records/` -- see `sim/README.md`. What IS run here is the
# harness's own stdlib-only unit tests (`sim/harness/tests/`, selftest step
# 0, issue #75), which need no PDK and no installs. Do not silently drop
# this comment if the PDK-heavy leg is ever added -- update `sim/README.md`
# in the same change.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  signoff-manifest-parity:
    name: signoff manifest parity (T1 verdict of record, pinned klt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Pinned to the exact klt build that froze the committed report --
      # a different build (different tier doc item set, different grading
      # rules, different `build` block) is itself a parity divergence.
      # See manifests/README.md for the freeze/pin contract.
      - name: Install klt (pinned, see manifests/README.md)
        run: |
          python3 -m pip install --disable-pip-version-check \
            "klayout-tools @ git+https://github.com/2AMLogic/klayout-tools@e8ca621a6961879cec1af60cc932c3b3d58ddcaa"
          klt --version

      - name: Fresh-render parity check vs committed report
        run: python3 scripts/check_signoff_report.py

      - name: Render the tier report (text, for the run log)
        if: always()
        run: klt signoff --manifest manifests/sg13g2-comparator.json || test $? -eq 3

  # Layout reproducibility (issue #58): the committed GDS must be exactly what
  # layout/comparator/generate.py draws from a clean checkout, and that drawing
  # must still reconcile with design/comparator.spice. It also covers the
  # committed LVS evidence (issue #60): extraction, reference cut, request and
  # envelope freshness plus the match verdict. Needs only the pinned
  # klt and the KLayout Python module it brings -- no PDK -- so it belongs to
  # the same tool-light scope as the leg above. See layout/README.md.
  layout-reproducibility:
    name: layout reproducibility (committed GDS regenerates byte-for-byte)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Same klt pin as the leg above; KLayout pinned to the version that
      # klt build was tested against (layout/run_flow.sh, KLAYOUT_PIN).
      - name: Install klt (pinned) + KLayout
        run: |
          python3 -m pip install --disable-pip-version-check \
            "klayout-tools @ git+https://github.com/2AMLogic/klayout-tools@e8ca621a6961879cec1af60cc932c3b3d58ddcaa" \
            "klayout==0.30.10"
          klt --version

      - name: Regenerate and verify the committed layout
        run: KLT_NATIVE=1 layout/run_flow.sh --check

  # Harness unit tests (issue #75): the same command as `sim/selftest.sh`
  # step 0. Pure stdlib -- no PDK, no ngspice, no installs -- so it belongs
  # to the same tool-light scope as the legs above. The PDK-dependent
  # selftest steps stay local (see sim/README.md).
  harness-unit-tests:
    name: harness unit tests (stdlib only, no PDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run sim harness unit tests
        run: PYTHONPATH=sim python3 -m unittest discover -t sim -s harness.tests -p 'test_*.py'

      # Issue #62: the klt sim corner-verification adapter's grading rules
      # (sim/kltsim/), same stdlib-only contract; `sim/selftest.sh` step 0.
      # Includes test_build_preserve.py (issue #95): campaign inputs are
      # append-only; a changed rebuild is rejected before any write.
      - name: Run kltsim grading unit tests
        run: PYTHONPATH=sim python3 -m unittest discover -t sim -s sim/kltsim/tests -p 'test_*.py'
